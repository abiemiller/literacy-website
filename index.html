<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Literacy Wheel</title>

<style>
body {
  margin: 0;
  background: transparent;
}

.wheel-stage {
  position: relative;
  width: min(95vw, 700px);
  height: min(95vw, 700px);
  margin: auto;
  overflow: visible;
}

#spinArea {
  position: absolute;
  inset: 0;
  transition: transform 5.5s cubic-bezier(.12,.72,.18,1);
  transform-origin: 50% 50%;
  will-change: transform;
}

.wheel-image {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  transform: translateZ(0);
}

.click-map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 20;
}

.click-wedge {
  fill: transparent;
  cursor: pointer;
}

.click-wedge:hover {
  fill: rgba(255, 255, 255, 0.28);
}

.outer-ring-map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 25;
  pointer-events: none;
}

.outer-ring-link {
  fill: transparent;
  cursor: pointer;
  pointer-events: auto;
}

.outer-ring-link:hover {
  fill: rgba(255, 255, 255, 0.18);
}

.center-click {
  position: absolute;
  z-index: 40;
  top: 50%;
  left: 50%;
  width: 27%;
  height: 27%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="wheel-stage">

  <div id="spinArea">

    <img src="Assessment.png" class="wheel-image" alt="Literacy for MLs Wheel">

    <svg class="click-map" viewBox="0 0 100 100">

      <!-- Visual wedge: Phonics and Spelling | Link: Phonological Awareness -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonological-awareness" target="_blank">
        <path class="click-wedge" d="M 50 12 A 38 38 0 0 1 76.87 23.13 L 64.85 35.15 A 21 21 0 0 0 50 29 Z"></path>
      </a>

      <!-- Visual wedge: Assessment | Link: Phonics and Spelling -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonics-and-spelling" target="_blank">
        <path class="click-wedge" d="M 76.87 23.13 A 38 38 0 0 1 88 50 L 71 50 A 21 21 0 0 0 64.85 35.15 Z"></path>
      </a>

      <!-- Visual wedge: Culturally and Linguistically Responsive | Link: Assessment -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/assessment" target="_blank">
        <path class="click-wedge" d="M 88 50 A 38 38 0 0 1 76.87 76.87 L 64.85 64.85 A 21 21 0 0 0 71 50 Z"></path>
      </a>

      <!-- Visual wedge: Cross Linguistic Connections | Link: CLR -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/culturally-and-linguistically-responsive" target="_blank">
        <path class="click-wedge" d="M 76.87 76.87 A 38 38 0 0 1 50 88 L 50 71 A 21 21 0 0 0 64.85 64.85 Z"></path>
      </a>

      <!-- Visual wedge: Syntax | Link: Cross Linguistic Connections -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/cross-linguistic-connections" target="_blank">
        <path class="click-wedge" d="M 50 88 A 38 38 0 0 1 23.13 76.87 L 35.15 64.85 A 21 21 0 0 0 50 71 Z"></path>
      </a>

      <!-- Visual wedge: Text Comprehension and Written Expression | Link: Syntax -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/syntax" target="_blank">
        <path class="click-wedge" d="M 23.13 76.87 A 38 38 0 0 1 12 50 L 29 50 A 21 21 0 0 0 35.15 64.85 Z"></path>
      </a>

      <!-- Visual wedge: Vocabulary and Morphology | Link: Text Comprehension and Written Expression -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/text-comprehension-and-written-expression" target="_blank">
        <path class="click-wedge" d="M 12 50 A 38 38 0 0 1 23.13 23.13 L 35.15 35.15 A 21 21 0 0 0 29 50 Z"></path>
      </a>

      <!-- Visual wedge: Phonological Awareness | Link: Vocabulary and Morphology -->
      <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/vocabulary-and-morphology" target="_blank">
        <path class="click-wedge" d="M 23.13 23.13 A 38 38 0 0 1 50 12 L 50 29 A 21 21 0 0 0 35.15 35.15 Z"></path>
      </a>

    </svg>

  </div>

  <!-- OUTER RING LINK -->
  <svg class="outer-ring-map" viewBox="0 0 100 100">
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/oracy" target="_blank">
      <path class="outer-ring-link" d="
        M 50 1
        A 49 49 0 1 1 49.99 1
        M 50 13
        A 37 37 0 1 0 50.01 13
        Z
      "></path>
    </a>
  </svg>

  <button class="center-click" onclick="spinWheel()" aria-label="Spin wheel"></button>

</div>

<script>
let rotation = 0;

function spinWheel() {
  rotation += 720 + Math.floor(Math.random() * 240);
  document.getElementById("spinArea").style.transform = "rotate(" + rotation + "deg)";
}
</script>

</body>
</html>
