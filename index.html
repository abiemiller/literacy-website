<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Literacy Wheel</title>

<style>
body {
  margin: 0;
  background: transparent;
}

.wheel-stage {
  position: relative;
  width: min(95vw, 700px);
  height: min(95vw, 700px);
  margin: auto;
}

#spinArea {
  position: absolute;
  inset: 0;
  transition: transform 14s cubic-bezier(.08,.65,.12,1);
  transform-origin: 50% 50%;
}

.wheel-image {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
}

.click-map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 20;
}

.click-wedge,
.outer-ring-link {
  fill: transparent;
  cursor: pointer;
}

.click-wedge:hover {
  fill: rgba(255, 255, 255, 0.18);
}

.outer-ring-link:hover {
  fill: rgba(255, 255, 255, 0.10);
}

.center-click {
  position: absolute;
  z-index: 40;
  top: 50%;
  left: 50%;
  width: 27%;
  height: 27%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="wheel-stage">

  <div id="spinArea">
    <img src="Assessment.png" class="wheel-image" alt="Literacy for MLs Wheel">
    <svg id="wedgeMap" class="click-map" viewBox="0 0 100 100"></svg>
  </div>

  <svg class="click-map" viewBox="0 0 100 100">
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/oracy" target="_blank">
      <path class="outer-ring-link" fill-rule="evenodd" d="
        M 50 1 A 49 49 0 1 1 49.99 1 Z
        M 50 7 A 43 43 0 1 0 50.01 7 Z
      "></path>
    </a>
  </svg>

  <button class="center-click" onclick="spinWheel()" aria-label="Spin wheel"></button>

</div>

<script>
let rotation = 0;

const wedges = [
  {
    label: "Assessment",
    angle: -90,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/assessment"
  },
  {
    label: "Culturally and Linguistically Responsive",
    angle: -45,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/culturally-and-linguistically-responsive"
  },
  {
    label: "Cross Linguistic Connections",
    angle: 0,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/cross-linguistic-connections"
  },
  {
    label: "Syntax",
    angle: 45,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/syntax"
  },
  {
    label: "Text Comprehension and Written Expression",
    angle: 90,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/text-comprehension-and-written-expression"
  },
  {
    label: "Vocabulary and Morphology",
    angle: 135,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/vocabulary-and-morphology"
  },
  {
    label: "Phonological Awareness",
    angle: 180,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonological-awareness"
  },
  {
    label: "Phonics and Spelling",
    angle: 225,
    url: "https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonics-and-spelling"
  }
];

function polarToXY(cx, cy, r, angleDegrees) {
  const angleRadians = angleDegrees * Math.PI / 180;
  return {
    x: cx + r * Math.cos(angleRadians),
    y: cy + r * Math.sin(angleRadians)
  };
}

function wedgePath(centerAngle) {
  const cx = 50;
  const cy = 50;
  const outerR = 46;
  const innerR = 13;
  const half = 22.5;

  const start = centerAngle - half;
  const end = centerAngle + half;

  const p1 = polarToXY(cx, cy, outerR, start);
  const p2 = polarToXY(cx, cy, outerR, end);
  const p3 = polarToXY(cx, cy, innerR, end);
  const p4 = polarToXY(cx, cy, innerR, start);

  return `
    M ${p1.x} ${p1.y}
    A ${outerR} ${outerR} 0 0 1 ${p2.x} ${p2.y}
    L ${p3.x} ${p3.y}
    A ${innerR} ${innerR} 0 0 0 ${p4.x} ${p4.y}
    Z
  `;
}

function drawWedges() {
  const svg = document.getElementById("wedgeMap");

  wedges.forEach(wedge => {
    const link = document.createElementNS("http://www.w3.org/2000/svg", "a");
    link.setAttribute("href", wedge.url);
    link.setAttribute("target", "_blank");

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "click-wedge");
    path.setAttribute("d", wedgePath(wedge.angle));

    link.appendChild(path);
    svg.appendChild(link);
  });
}

function spinWheel() {
  rotation += 360 + Math.floor(Math.random() * 60);
  document.getElementById("spinArea").style.transform = "rotate(" + rotation + "deg)";
}

drawWedges();
</script>

</body>
</html>
