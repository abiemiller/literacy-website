<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Literacy Wheel</title>

<style>
body {
  margin: 0;
  background: transparent;
}

.wheel-stage {
  position: relative;
  width: min(95vw, 700px);
  height: min(95vw, 700px);
  margin: auto;
}

#spinArea {
  position: absolute;
  inset: 0;
  transition: transform 12s cubic-bezier(.08,.65,.12,1);
  transform-origin: 50% 50%;
}

.wheel-image {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
}

.click-map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 20;
}

.click-wedge,
.outer-ring-link {
  fill: transparent;
  cursor: pointer;
}

.click-wedge:hover {
  fill: rgba(255, 255, 255, 0.20);
}

.outer-ring-link:hover {
  fill: rgba(255, 255, 255, 0.10);
}

.center-click {
  position: absolute;
  z-index: 40;
  top: 50%;
  left: 50%;
  width: 27%;
  height: 27%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="wheel-stage">

  <div id="spinArea">
    <img src="Assessment.png" class="wheel-image" alt="Literacy for MLs Wheel">
  </div>

  <svg class="click-map" viewBox="0 0 100 100">

    <!-- THINNER OUTER RING LINK -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/oracy" target="_blank">
      <path class="outer-ring-link" fill-rule="evenodd" d="
        M 50 1 A 49 49 0 1 1 49.99 1 Z
        M 50 8 A 42 42 0 1 0 50.01 8 Z
      "></path>
    </a>

    <!-- This wedge now goes to Assessment -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/assessment" target="_blank">
      <path class="click-wedge" d="M 50 6 A 44 44 0 0 1 81.11 18.89 L 59.90 40.10 A 14 14 0 0 0 50 36 Z"></path>
    </a>

    <!-- This wedge now goes to Culturally and Linguistically Responsive -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/culturally-and-linguistically-responsive" target="_blank">
      <path class="click-wedge" d="M 81.11 18.89 A 44 44 0 0 1 94 50 L 64 50 A 14 14 0 0 0 59.90 40.10 Z"></path>
    </a>

    <!-- This wedge now goes to Cross Linguistic Connections -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/cross-linguistic-connections" target="_blank">
      <path class="click-wedge" d="M 94 50 A 44 44 0 0 1 81.11 81.11 L 59.90 59.90 A 14 14 0 0 0 64 50 Z"></path>
    </a>

    <!-- This wedge now goes to Syntax -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/syntax" target="_blank">
      <path class="click-wedge" d="M 81.11 81.11 A 44 44 0 0 1 50 94 L 50 64 A 14 14 0 0 0 59.90 59.90 Z"></path>
    </a>

    <!-- This wedge now goes to Text Comprehension and Written Expression -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/text-comprehension-and-written-expression" target="_blank">
      <path class="click-wedge" d="M 50 94 A 44 44 0 0 1 18.89 81.11 L 40.10 59.90 A 14 14 0 0 0 50 64 Z"></path>
    </a>

    <!-- This wedge now goes to Vocabulary and Morphology -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/vocabulary-and-morphology" target="_blank">
      <path class="click-wedge" d="M 18.89 81.11 A 44 44 0 0 1 6 50 L 36 50 A 14 14 0 0 0 40.10 59.90 Z"></path>
    </a>

    <!-- This wedge now goes to Phonological Awareness -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonological-awareness" target="_blank">
      <path class="click-wedge" d="M 6 50 A 44 44 0 0 1 18.89 18.89 L 40.10 40.10 A 14 14 0 0 0 36 50 Z"></path>
    </a>

    <!-- This wedge now goes to Phonics and Spelling -->
    <a href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonics-and-spelling" target="_blank">
      <path class="click-wedge" d="M 18.89 18.89 A 44 44 0 0 1 50 6 L 50 36 A 14 14 0 0 0 40.10 40.10 Z"></path>
    </a>

  </svg>

  <button class="center-click" onclick="spinWheel()" aria-label="Spin wheel"></button>

</div>

<script>
let rotation = 0;

function spinWheel() {
  rotation += 360 + Math.floor(Math.random() * 90);
  document.getElementById("spinArea").style.transform = "rotate(" + rotation + "deg)";
}
</script>

</body>
</html>
