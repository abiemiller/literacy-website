<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Literacy Wheel</title>

<style>
body {
  margin: 0;
  background: transparent;
}

.wheel-stage {
  position: relative;
  width: min(95vw, 700px);
  height: min(95vw, 700px);
  margin: auto;
}

#spinArea {
  position: absolute;
  inset: 0;
  transition: transform 3s ease-out;
  transform-origin: center center;
}

.wheel-image {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
}

.hotspot {
  position: absolute;
  z-index: 10;
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

/* Clickable wedge areas */
.hs1 { top: 8%; left: 52%; }
.hs2 { top: 29%; left: 68%; }
.hs3 { top: 53%; left: 68%; }
.hs4 { top: 69%; left: 52%; }
.hs5 { top: 69%; left: 24%; }
.hs6 { top: 53%; left: 8%; }
.hs7 { top: 29%; left: 8%; }
.hs8 { top: 8%; left: 24%; }

.center-click {
  position: absolute;
  z-index: 30;
  top: 50%;
  left: 50%;
  width: 26%;
  height: 26%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="wheel-stage">

  <div id="spinArea">
    <img src="Assessment.png" class="wheel-image" alt="Literacy for MLs Wheel">

    <a class="hotspot hs1" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonics-and-spelling" target="_blank"></a>
    <a class="hotspot hs2" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/assessment" target="_blank"></a>
    <a class="hotspot hs3" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/culturally-and-linguistically-responsive" target="_blank"></a>
    <a class="hotspot hs4" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/cross-linguistic-connections" target="_blank"></a>
    <a class="hotspot hs5" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/syntax" target="_blank"></a>
    <a class="hotspot hs6" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/text-comprehension-and-written-expression" target="_blank"></a>
    <a class="hotspot hs7" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/vocabulary-and-morphology" target="_blank"></a>
    <a class="hotspot hs8" href="https://sites.google.com/cherrycreekschools.org/ccsd-literacy-for-mls/phonological-awareness" target="_blank"></a>
  </div>

  <button class="center-click" onclick="spinWheel()" aria-label="Spin wheel"></button>

</div>

<script>
let rotation = 0;

function spinWheel() {
  rotation += 1080 + Math.floor(Math.random() * 360);
  document.getElementById("spinArea").style.transform = "rotate(" + rotation + "deg)";
}
</script>

</body>
</html>
